      <stop stop-color="#C1D5CD"/><stop offset=".42" stop-color="#E5DECA"/><stop offset="1" stop-color="#E8D3AD"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1135 202) rotate(90) scale(380)">
      <stop stop-color="#FFE1A8" stop-opacity=".85"/><stop offset=".52" stop-color="#F7D7A3" stop-opacity=".4"/><stop offset="1" stop-color="#F7D7A3" stop-opacity="0"/>
