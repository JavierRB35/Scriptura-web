# CI de Scriptura Web: lint, tipos, pruebas unitarias y de integración real
# contra PostgreSQL con pgvector (§22). main permanece siempre verde.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scriptura
          POSTGRES_PASSWORD: scriptura
          POSTGRES_DB: scriptura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scriptura -d scriptura_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://scriptura:scriptura@localhost:5432/scriptura_test
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas unitarias
        run: npm run test:unit
      - name: Importar Biblia RV1909 (integridad real en cada CI)
        run: node scripts/import-bible.ts --publish
      - name: Pruebas de integración (migraciones + integridad bíblica)
        run: npm run test:integration
