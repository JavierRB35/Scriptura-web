# Importación editorial de imágenes libres para seis evangelios extracanonicos.
# La ejecución inicial se dispara al incorporar este workflow a main.
name: Archivar imágenes apócrifas libres

on:
  push:
    paths:
      - .github/workflows/import-apocrypha-images.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scriptura-import-apocrypha-images
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar codificador WebP y validador de imágenes
        run: python -m pip install 'Pillow>=11,<13'
      - name: Descargar seis imágenes libres y preparar los seis WebP
        run: python scripts/import-apocrypha-images.py
      - name: Comprobar manifiesto, imágenes e integridad SHA-256
        run: python scripts/import-apocrypha-images.py --verify
      - name: Incorporar originales y variantes optimizadas al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/apocrypha/originals public/images/apocrypha data/apocrypha/images-manifest.json
          if git diff --cached --quiet; then
            echo "Imágenes existentes y sin cambios"
            exit 0
          fi
          git commit -m "assets(apocrypha): seis imágenes originales y copias web documentadas"
          git pull --rebase origin main
          git push origin HEAD:main
